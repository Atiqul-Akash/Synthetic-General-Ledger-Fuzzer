version: "3.8"

services:
  # 1. High-performance, zero-Zookeeper Kafka-compatible streaming broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: gl_fuzzer_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Mock SAP S/4HANA OData V4 Gateway Service
  mock-sap-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.mock_sap
    container_name: gl_fuzzer_mock_sap
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 3. AWS Kinesis Cloud Streaming Emulator
  localstack:
    image: localstack/localstack:3.0.2
    container_name: gl_fuzzer_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD-SHELL", "awslocal kinesis list-streams || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Synthetic General Ledger Fuzzer Web GUI & API Gateway
  gl-fuzzer:
    build:
      context: .
      dockerfile: docker/Dockerfile.fuzzer
    container_name: gl_fuzzer_app
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - SAP_ODATA_HOST=mock-sap-gateway
      - SAP_ODATA_PORT=8000
    depends_on:
      - redpanda
      - mock-sap-gateway
